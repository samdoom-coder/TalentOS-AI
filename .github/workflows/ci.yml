name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TalentOS-AI-main/package-lock.json
      - working-directory: TalentOS-AI-main
        run: |
          cp .env.example .env
          npm ci
          npm run typecheck
          npm test
          npx prisma generate
          npm run build
