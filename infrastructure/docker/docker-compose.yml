services:
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://talentos:talentos@postgres:5432/talentos
      DATABASE_PROVIDER: postgresql
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-min-32-chars}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      STORAGE_PROVIDER: local
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads:/app/uploads

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    command: ["node", "worker.js"]
    environment:
      DATABASE_URL: postgresql://talentos:talentos@postgres:5432/talentos
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talentos
      POSTGRES_PASSWORD: talentos
      POSTGRES_DB: talentos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  uploads:
