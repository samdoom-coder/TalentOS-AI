services:
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://talentos:talentos@postgres:5432/talentos
      DATABASE_PROVIDER: postgresql
      REDIS_URL: redis://redis:6379
      # REQUIRED: export AUTH_SECRET with 32+ random chars; compose fails fast otherwise.
      # Generate: openssl rand -hex 32
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET to 32+ random chars}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      EXECUTION_PROVIDER: ${EXECUTION_PROVIDER:-judge0}
      STORAGE_PROVIDER: local
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads:/app/uploads

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    command: ["npx", "tsx", "worker.ts"]
    healthcheck:
      disable: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://talentos:talentos@postgres:5432/talentos
      DATABASE_PROVIDER: postgresql
      REDIS_URL: redis://redis:6379
      # REQUIRED: export AUTH_SECRET with 32+ random chars; compose fails fast otherwise.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET to 32+ random chars}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      EXECUTION_PROVIDER: ${EXECUTION_PROVIDER:-judge0}
      STORAGE_PROVIDER: local
      STORAGE_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talentos
      POSTGRES_PASSWORD: talentos
      POSTGRES_DB: talentos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  uploads:
